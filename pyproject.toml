[project]
name = "oats"
version = "0.7.0"
description = "OATS (Open Annotation Type Schemas): reference schemas and test suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema-rs>=0.38",
    "hypothesis>=6.0",
    "hypothesis-jsonschema>=0.23.1",
    "packaging>=24.0",
    "ruff==0.17.0",
    "mypy>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["tests"]
exclude = ["^venv/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["hypothesis_jsonschema"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["venv"]
